name: Award Flight Monitor

on:
  schedule:
    # Every 30 min from 09:00 to 23:00 UTC (06:00-20:00 BRT)
    - cron: '*/30 9-22 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite state
        uses: actions/cache@v4
        with:
          path: data/state.sqlite
          key: sqlite-state-${{ github.run_number }}
          restore-keys: |
            sqlite-state-

      - name: Run monitor
        env:
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NODE_ENV: production
          LOG_LEVEL: info
          DB_PATH: ./data/state.sqlite
        run: npm run search

      - name: Save SQLite state
        uses: actions/cache@v4
        if: always()
        with:
          path: data/state.sqlite
          key: sqlite-state-${{ github.run_number }}
